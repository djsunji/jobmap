# Holt jede Nacht neue Stellen, speichert data/jobs.json und veröffentlicht die Website neu.
name: Stellen aktualisieren

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: jobmap-update
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -r crawler/requirements.txt

      - name: Crawler starten
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
        run: python crawler/crawl.py

      - name: Neue Daten speichern
        run: |
          git config user.name  "jobmap-bot"
          git config user.email "jobmap-bot@users.noreply.github.com"
          git add data/jobs.json crawler/cache/geocache.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Stellen aktualisiert ($(date -u +%Y-%m-%d))"
            git push
          fi

  deploy:
    needs: crawl
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
