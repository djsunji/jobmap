# Veröffentlicht die Website auf GitHub Pages
name: Website veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Website-Dateien zusammenstellen
        run: |
          mkdir -p _site/data
          cp index.html _site/
          [ -f data/jobs.json ] && cp data/jobs.json _site/data/ || echo '{"jobs":[]}' > _site/data/jobs.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
