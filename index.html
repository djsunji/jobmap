  --warn-bg:#FFF4DC; --warn-fg:#7A5300; --ok-bg:#E3F5E8; --ok-fg:#14692F; --danger:#D42F47;

  --shadow-sm:0 6px 18px rgba(11,31,58,.12);
  --shadow-lg:0 18px 40px rgba(11,31,58,.22);
  --mix-text:#000; --glass:rgba(255,255,255,.95);
  --f-display:"Outfit","Avenir Next","Helvetica Neue",sans-serif;
  --f-body:"Figtree","Helvetica Neue",sans-serif;
  --f-mono:"Figtree","Helvetica Neue",sans-serif;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A1426; --panel:#111F36; --soft:#0E1A2E; --fg:#E8EEF7; --muted:#97A7BF; --line:#22344F; --line-2:#1B2B44;
  --navy:#E8EEF7; --blue:#3D9BFF; --blue-deep:#7AB8FF; --sky:#16304F; --chip:#1A2B45; --chip-fg:#C9D5E6;
  --ink-btn:#E8EEF7; --ink-btn-fg:#0A1426;
  --accent:#3D9BFF; --accent-soft:rgba(61,155,255,.15); --grad:#2F8CFF;
  --pin:#3D9BFF; --pin-sel:#E8EEF7; --far:#5B6E8E; --bg-2:#0E1A2E;
  --warn-bg:#3A2C0C; --warn-fg:#F5D48A; --ok-bg:#12321F; --ok-fg:#8EE0A8; --danger:#FF6B7F;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.35);
  --shadow-sm:0 6px 18px rgba(0,0,0,.4); --shadow-lg:0 18px 40px rgba(0,0,0,.5);
  --mix-text:#fff; --glass:rgba(17,31,54,.95);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
a{color:var(--blue-deep)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{display:flex;flex-direction:column;min-height:100%}

/* Kopfzeile */
header.top{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 32px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none}
.brand-pin{width:28px;height:36px;flex:none}
.wordmark{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;letter-spacing:-.04em}
.wm-job{color:var(--navy)}.wm-map{color:var(--blue)}
.main-nav{display:flex;gap:4px;flex-wrap:wrap}
.main-nav a,.main-nav button{display:flex;align-items:center;gap:6px;padding:10px 14px;border-radius:10px;border:0;background:none;color:var(--chip-fg);font-weight:500;font-size:15px;text-decoration:none;cursor:pointer}
.main-nav .on{background:var(--sky);color:var(--blue-deep);font-weight:600}
.badge{background:var(--danger);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:1px 7px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.demo{font-size:13px;background:var(--warn-bg);color:var(--warn-fg);padding:6px 12px;border-radius:999px;font-weight:600}
.demo.live{background:var(--ok-bg);color:var(--ok-fg)}
.theme-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--navy);display:grid;place-items:center;cursor:pointer}
.theme-btn:hover{background:var(--sky)}
.theme-btn svg{width:20px;height:20px}
.theme-btn .ico-sun{display:none}
:root[data-theme="dark"] .theme-btn .ico-sun{display:block}
:root[data-theme="dark"] .theme-btn .ico-moon{display:none}

/* Suche */
.search-wrap{padding:26px 32px 12px;display:flex;flex-direction:column;gap:14px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hero h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:38px;letter-spacing:-.03em;line-height:1.1;text-wrap:balance}
.hero p{margin:6px 0 0;color:var(--muted);font-size:16px}
form.search{background:var(--panel);border-radius:20px;box-shadow:var(--shadow);padding:8px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1.2fr) auto;gap:8px}
.field{position:relative;display:flex;align-items:center;gap:12px;padding:8px 10px 8px 18px;border-radius:14px;background:var(--soft);min-width:0}
.field:focus-within{box-shadow:inset 0 0 0 2px var(--blue)}
.field>svg{flex:none;width:22px;height:22px;color:var(--muted)}
.field-body{display:flex;flex-direction:column;flex:1;min-width:0}
.field label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input[type=text]{border:0;background:transparent;outline:none;font:600 19px var(--f-body);color:var(--fg);padding:2px 0;width:100%;min-width:0}
.field input::placeholder{color:var(--muted);font-weight:500;opacity:.8}
.icon-sq{width:44px;height:44px;border-radius:12px;border:0;background:var(--panel);color:var(--blue-deep);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-sq svg{width:20px;height:20px}
.icon-sq.busy{opacity:.5;cursor:progress}
.btn{border:0;border-radius:14px;padding:0 26px;font-family:var(--f-display);font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-deep)}
:root[data-theme="dark"] .btn-primary:hover{background:#1F7BEA}
form.search .btn-primary{min-height:64px;padding:0 34px;font-size:17px}
.btn-ghost{background:var(--chip);color:var(--fg)}
.btn-link{display:inline-flex;align-items:center;text-decoration:none}
.geo-msg{font-size:14px;color:var(--danger)}
.suggest{position:absolute;left:0;right:0;top:100%;margin:6px 0 0;padding:6px;list-style:none;background:var(--panel);border-radius:16px;box-shadow:var(--shadow-lg);z-index:2000;max-height:300px;overflow-y:auto}
.suggest li{padding:10px 12px;border-radius:10px;cursor:pointer;font-size:15px}
.suggest li:hover{background:var(--sky)}

/* Umkreis + Filter */
.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.radius-group{display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px}
.radius-group .lbl{font-size:13px;font-weight:700;color:var(--muted);padding:0 8px 0 10px}
.radius-group button{height:40px;min-width:44px;padding:0 11px;border-radius:10px;border:0;background:transparent;color:var(--fg);font:600 14px var(--f-body);cursor:pointer}
.radius-group button:hover{background:var(--sky)}
.radius-group button[aria-pressed=true]{background:var(--blue);color:#fff}
.vsep{width:1px;height:28px;background:var(--line)}
.pill{position:relative;display:inline-flex;align-items:center;height:44px;padding:0 10px 0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.pill span{font-size:13px;color:var(--muted);margin-right:4px;white-space:nowrap}
.pill select{border:0;background:transparent;font:600 14px var(--f-body);color:var(--fg);cursor:pointer;outline:none;max-width:190px}
.pill.active{border-color:var(--blue);background:var(--sky)}
.pill.active select{color:var(--blue-deep)}
.pill.sub{border-style:dashed;border-color:var(--blue)}
.link-btn{background:none;border:0;color:var(--blue-deep);font-weight:600;cursor:pointer;padding:10px 6px;font-size:14px}
select option,select optgroup{background-color:var(--panel);color:var(--fg)}

/* Branchen */
.cats{display:flex;gap:8px;flex-wrap:wrap}
.cat-pill{height:44px;display:flex;align-items:center;gap:8px;padding:0 14px 0 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:600 14px var(--f-body);cursor:pointer;white-space:nowrap}
.cat-pill:hover{border-color:var(--muted)}
.cat-pill[aria-pressed=true]{border:2px solid var(--navy);padding:0 13px 0 8px}
.cat-pill .n{color:var(--muted);font-weight:500}
.lg-ic{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;flex:none}
.lg-ic svg{width:14px;height:14px}
.lg-ic.all{background:var(--blue)}

/* Liste + Karte */
.split{flex:1;padding:6px 32px 32px;display:grid;grid-template-columns:minmax(360px,460px) minmax(0,1fr);gap:20px;height:max(640px,calc(100vh - 110px))}
.list-pane{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px 14px;border-bottom:1px solid var(--line-2)}
.count{font-family:var(--f-display);font-size:20px;font-weight:700;text-wrap:balance}
.count small{display:block;font-family:var(--f-body);font-size:13px;font-weight:400;color:var(--muted)}
.sort select{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:0 8px;font:600 14px var(--f-body);color:var(--fg)}
.list{overflow-y:auto;flex:1;min-height:0;padding:10px;display:flex;flex-direction:column;gap:6px}
.list::-webkit-scrollbar{width:8px}.list::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.card{position:relative;padding:14px;border-radius:16px;cursor:pointer;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:6px 14px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line-2)}
.card:hover,.card.hover{background:var(--soft)}
.card.sel{background:var(--sky);box-shadow:inset 0 0 0 2px var(--blue)}
.card h3{margin:0;font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.25;color:var(--fg)}
.card .co{color:var(--muted);font-size:14px;margin-top:2px}
.dist{font-size:14px;text-align:right;white-space:nowrap;color:var(--blue-deep);font-weight:700}
.dist small{display:block;color:var(--muted);font-size:11px;font-weight:500}
.chips{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);color:var(--chip-fg);border-radius:8px;padding:3px 9px;font-size:13px;white-space:nowrap}
.chip.cat{background:color-mix(in srgb,var(--c) 15%,var(--panel));color:color-mix(in srgb,var(--c) 70%,var(--mix-text));font-weight:700}
.chip.lehr{background:var(--warn-bg);color:var(--warn-fg)}
.meta{grid-column:2/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.meta .sal{font-weight:700;color:var(--fg)}
.meta .sal.na{font-weight:500;color:var(--muted)}
.meta .right{display:flex;align-items:center;gap:4px}
.icon-btn{background:none;border:0;cursor:pointer;width:36px;height:36px;border-radius:10px;color:var(--muted);font-size:18px;line-height:1;display:grid;place-items:center}
.icon-btn:hover{background:var(--chip)}
.icon-btn.on{color:var(--danger)}
.co-logo{width:48px;height:48px;border-radius:14px;display:block;flex:none;overflow:hidden}
.co-logo svg{display:block;width:48px;height:48px}
.co-img{background:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line)}
.co-img img{max-width:40px;max-height:40px;object-fit:contain}
.detail{grid-column:1/-1;border-top:1px dashed var(--line);margin-top:8px;padding-top:12px;cursor:default}
.detail h4{margin:12px 0 4px;font-family:var(--f-display);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.detail ul{margin:0;padding-left:18px}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:14px}
.detail dt{color:var(--muted)}.detail dd{margin:0}
.detail .actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.detail .btn{padding:0 18px}
.desc{margin:0;font-size:14px;line-height:1.55;white-space:pre-line}
.note{font-size:13px;color:var(--muted);margin-top:6px}
.empty{padding:32px 18px;color:var(--muted);text-align:center}
.src-note{padding:10px 20px;border-top:1px solid var(--line-2);font-size:12px;color:var(--muted)}

.map-pane{position:relative;min-height:0;border-radius:20px;overflow:hidden;background:var(--bg-2);box-shadow:var(--shadow)}
#map{position:absolute;inset:0;background:var(--bg-2);cursor:crosshair}
.leaflet-container{font-family:var(--f-body)}
.map-layer{position:absolute;left:16px;top:16px;z-index:1000;display:flex;gap:4px;background:var(--panel);border-radius:14px;padding:4px;box-shadow:var(--shadow-sm)}
.map-layer button{height:40px;padding:0 14px;border-radius:10px;border:0;background:transparent;color:var(--fg);font:600 14px var(--f-body);cursor:pointer}
.map-layer button[aria-pressed=true]{background:var(--ink-btn);color:var(--ink-btn-fg)}
.map-ctrl{position:absolute;right:16px;top:118px;z-index:1000}
.map-ctrl button{width:46px;height:46px;border-radius:14px;border:0;background:var(--panel);color:var(--fg);box-shadow:var(--shadow-sm);display:grid;place-items:center;cursor:pointer}
.map-ctrl svg{width:20px;height:20px}
.map-hint{position:absolute;left:16px;bottom:16px;z-index:1000;background:var(--glass);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--chip-fg);box-shadow:var(--shadow-sm);max-width:calc(100% - 140px)}
.leaflet-top.leaflet-right .leaflet-control{margin:16px 16px 0 0}
.leaflet-bar{border:0!important;box-shadow:var(--shadow-sm)!important;border-radius:14px!important;overflow:hidden}
.leaflet-bar a{width:46px!important;height:46px!important;line-height:46px!important;background:var(--panel)!important;color:var(--fg)!important;border-bottom-color:var(--line-2)!important;font-size:22px!important}
.leaflet-tooltip{font-family:var(--f-body);border:0;border-radius:10px;box-shadow:var(--shadow-sm);background:var(--panel);color:var(--fg)}
.leaflet-tooltip-top:before{border-top-color:var(--panel)}
.leaflet-control-attribution{font-size:11px}
:root[data-theme="dark"] .leaflet-control-attribution{background:rgba(17,31,54,.85)!important;color:var(--muted)}
:root[data-theme="dark"] .leaflet-control-scale-line{background:rgba(17,31,54,.85);color:var(--fg);border-color:var(--fg)}

/* Pins, Gruppen, Standort */
.jm-pin{position:relative}
.jm-pin b{position:absolute;inset:0;border-radius:50% 50% 50% 0;rotate:-45deg;background:var(--c);border:3px solid #fff;box-shadow:-2px 4px 10px rgba(11,31,58,.3)}
.jm-pin svg.pi{position:absolute;left:50%;top:50%;width:52%;height:52%;transform:translate(-50%,-50%);pointer-events:none}
.pi{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pi .f{fill:#fff;stroke:none}
.jm-pin.hover b,.jm-pin.sel b{box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 28%,transparent),-2px 4px 10px rgba(11,31,58,.35)}
.jm-cluster{background:#0B1F3A;color:#fff;border:3px solid #fff;border-radius:50%;display:grid;place-items:center;font:700 14px var(--f-display);box-shadow:0 6px 14px rgba(11,31,58,.3)}
.jm-home{position:relative}
.jm-home b{position:absolute;inset:7px;border-radius:50%;background:#0A7CFF;border:4px solid #fff;box-shadow:0 0 0 10px rgba(10,124,255,.18),0 4px 10px rgba(5,89,217,.4)}
.jm-city{font-family:var(--f-body);font-size:11px;font-weight:600;color:#44526B;white-space:nowrap;transform:translate(-50%,-140%);text-shadow:0 0 3px #F4F8FC,0 0 3px #F4F8FC}
.jm-city.big{font-size:12.5px;font-weight:700;color:#0B1F3A}
.map-fail{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted);background:var(--bg-2);z-index:1500}

/* Stellen-Karte auf der Karte (Popup) */
.leaflet-popup{position:absolute;text-align:left;margin-bottom:20px}
.leaflet-popup-content-wrapper{background:var(--panel);color:var(--fg);border-radius:18px;box-shadow:var(--shadow-lg);padding:0}
.leaflet-popup-content{margin:16px;min-width:290px;font-family:var(--f-body);font-size:14px;line-height:1.4}
.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-top:-1px;margin-left:-20px;overflow:hidden;pointer-events:none}
.leaflet-popup-tip{width:17px;height:17px;padding:1px;margin:-10px auto 0;transform:rotate(45deg);background:var(--panel);box-shadow:var(--shadow-sm)}
.leaflet-container a.leaflet-popup-close-button{position:absolute;top:6px;right:6px;width:32px;height:32px;font:22px/32px var(--f-body);color:var(--muted);text-decoration:none;text-align:center;border-radius:8px}
.pop{display:flex;flex-direction:column;gap:12px}
.pop-head{display:flex;gap:12px;align-items:flex-start;padding-right:24px}
.pop-head h3{margin:0;font-family:var(--f-display);font-size:17px;font-weight:700;line-height:1.25}
.pop-head .co{color:var(--muted);font-size:13px;margin-top:2px}
.pop .chips{display:flex;flex-wrap:wrap;gap:6px}
.pop-foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pop-foot b{font-size:15px}
.pop-foot .btn{min-height:44px;padding:0 18px;font-size:14px;color:#fff}

/* Ansicht wechseln (Handy) */
.view-fab{display:none}

@media (max-width:900px){
  header.top{padding:12px 16px;gap:12px}
  .main-nav{order:3;width:100%}
  .demo{display:none}
  .search-wrap{padding:16px 16px 8px}
  .hero h1{font-size:28px}
  .hero p{display:none}
  form.search{grid-template-columns:1fr}
  form.search .btn-primary{min-height:52px}
  .filters,.cats{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
  .filters>*,.cats>*{flex:none}
  .split{grid-template-columns:1fr;padding:6px 12px 96px;height:auto;min-height:0}
  .list-pane{max-height:none}
  .list{overflow:visible}
  .map-pane{height:72vh}
  .split[data-view=list] .map-pane{display:none}
  .split[data-view=map] .list-pane{display:none}
  .view-fab{display:flex;align-items:center;gap:8px;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:3000;background:var(--ink-btn);color:var(--ink-btn-fg);border:0;border-radius:999px;padding:14px 22px;font:700 15px var(--f-display);box-shadow:0 10px 24px rgba(11,31,58,.35);cursor:pointer}
  .view-fab svg{width:18px;height:18px}
}
@media (prefers-reduced-motion:no-preference){.card,.cat-pill,.radius-group button{transition:background-color .15s,border-color .15s}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <a class="brand" href="#" aria-label="jobmap Startseite">
      <svg class="brand-pin" viewBox="0 0 40 52" aria-hidden="true">
        <defs><linearGradient id="pinG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3FB4FF"/><stop offset=".5" stop-color="#0A7CFF"/><stop offset="1" stop-color="#0552E0"/></linearGradient></defs>
        <path d="M20 2C10.6 2 3 9.4 3 18.6c0 11.6 13.4 24.7 15.6 26.8a2 2 0 0 0 2.8 0C23.6 43.3 37 30.2 37 18.6 37 9.4 29.4 2 20 2Z" fill="url(#pinG)"/>
        <circle cx="20" cy="18.5" r="7.2" fill="#fff"/>
      </svg>
      <span class="wordmark"><span class="wm-job">job</span><span class="wm-map">map</span></span>
    </a>
    <nav class="main-nav" aria-label="Hauptnavigation">
      <button type="button" class="on" id="navJobs" aria-pressed="true">Jobs</button>
      <button type="button" id="navSaved" aria-pressed="false">Merkliste <span class="badge" id="savedCount" hidden>0</span></button>
    </nav>
    <div class="top-right">
      <span class="demo" id="demoBadge">Beispieldaten · noch keine echten Stellen geladen</span>
      <button type="button" class="theme-btn" id="themeBtn" aria-label="Design wechseln">
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span class="sr-only" id="themeLabel">Dunkel</span>
      </button>
    </div>
  </header>

  <section class="search-wrap" aria-label="Suche">
    <div class="hero">
      <div>
        <h1>Jobs in deiner Nähe finden</h1>
        <p>Adresse eingeben, Umkreis wählen, Stellen auf der Karte sehen.</p>
      </div>
    </div>

    <form class="search" id="searchForm" autocomplete="off">

// ---------- Adresse finden (Entwurf: PLZ/Ort-Verzeichnis statt Geocoding-Dienst) ----------
const ALIASES={"geneve":"Genève","genf":"Genève","biel":"Biel/Bienne","bienne":"Biel/Bienne","st gallen":"St. Gallen","sankt gallen":"St. Gallen","neuenburg":"Neuchâtel","freiburg":"Fribourg","sitten":"Sion","yverdon":"Yverdon-les-Bains","delsberg":"Delémont","pruntrut":"Porrentruy"};
function geocode(input){
  const s=norm(input);
  const m=input.match(/\b(\d{4})\b/);
  let hit=null;
  // Ortsname (längster Treffer)
  const names=PLACES.map(p=>({p,n:norm(p[0]).trim()})).concat(Object.entries(ALIASES).map(([k,v])=>({p:PLACES.find(p=>p[0]===v),n:k})));
  const padded=" "+s.replace(/\s+/g," ")+" ";
  names.sort((a,b)=>b.n.length-a.n.length);
  for(const {p,n} of names){if(padded.includes(" "+n+" ")){hit=p;break;}}
  if(m){const plz=+m[1];const exact=PLACES.find(p=>p[1]===plz);
    if(exact)return{lat:exact[2],lon:exact[3],label:plz+" "+exact[0]};
    if(hit)return{lat:hit[2],lon:hit[3],label:plz+" "+hit[0]};
    let best=null,bd=1e9;for(const p of PLACES){const d=Math.abs(p[1]-plz);if(d<bd&&Math.floor(p[1]/1000)===Math.floor(plz/1000)){bd=d;best=p;}}
    if(best&&bd<=150)return{lat:best[2],lon:best[3],label:"PLZ "+plz+" (bei "+best[0]+")"};
  }
  if(hit)return{lat:hit[2],lon:hit[3],label:hit[1]+" "+hit[0]};
  return null;
}
function nearestPlace(lat,lon){let b=null,bd=1e9;for(const p of PLACES){const d=haversine(lat,lon,p[2],p[3]);if(d<bd){bd=d;b=p;}}return{p:b,d:bd};}

function hashStr(t){let h=2166136261;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function companyLogo(name,logo){
  if(logo&&/^https:\/\//.test(logo))return `<span class="co-logo co-img"><img src="${esc(logo)}" alt="Logo ${esc(name)}" loading="lazy" onerror="this.parentNode.outerHTML=''"></span>`;
  if(logoCache[name])return logoCache[name];
  const h=hashStr(name),[c1,c2]=LOGO_COLORS[h%LOGO_COLORS.length],style=(h>>4)%4,id="lg"+h;
  const words=name.replace(/[&]/g," ").split(/\s+/).filter(w=>w&&!/^(AG|GmbH|SA|IT)$/.test(w));
  const ini=((words[0]||"?")[0]+((words[1]||"")[0]||"")).toUpperCase();
  const grad=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>`;

  else if(style===1)body=`<rect width="44" height="44" fill="#fff"/><circle cx="22" cy="22" r="15" fill="url(#${id})"/>`+txt("#fff",27.5,13);
  else if(style===2)body=`<rect width="44" height="44" fill="#fff"/><rect x="0" y="36" width="44" height="8" fill="url(#${id})"/>`+txt(c2,26,17);

}

const fCat=$("fCat");fCat.innerHTML='<option value="">Alle</option>'+FILTER_CATS.map(c=>`<option>${esc(c)}</option>`).join("");
const fSub=$("fSub");
function fillSub(){
  const cat=fCat.value;$("fSubPill").hidden=!cat;
  if(!cat){fSub.innerHTML='<option value="">Alle</option>';return;}
  const cnt={};JOBS.forEach(j=>{if(j.cat===cat)cnt[j.sub]=(cnt[j.sub]||0)+1;});
  const subs=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
  fSub.innerHTML='<option value="">Alle</option>'+subs.map(g=>`<option value="${esc(g)}">${esc(g)} (${cnt[g]||0})</option>`).join("");
}
fCat.addEventListener("change",fillSub);
const FILTER_IDS=["fCat","fSub","fPensum","fType","fSalary","fLevel","fMode","fDate"];
function readFilters(){return{q:norm($("q").value).trim(),cat:fCat.value,sub:fSub.value,pensum:$("fPensum").value,type:$("fType").value,salary:+$("fSalary").value,level:$("fLevel").value,mode:$("fMode").value,date:+$("fDate").value,saved:$("fSaved").checked,sort:$("sort").value};}
function matches(j,f){
  if(f.q){const hay=norm(j.title+" "+j.company+" "+j.cat+" "+j.sub+" "+j.place);if(!f.q.split(" ").every(w=>hay.includes(w)))return false;}
  if(f.cat&&j.cat!==f.cat)return false;
  if(f.sub&&j.sub!==f.sub)return false;
  if(f.pensum){const[a,b]=f.pensum.split("-").map(Number);if(!j.pensum||j.pensum[1]<a||j.pensum[0]>b)return false;}
  if(f.type&&j.type!==f.type)return false;
  if(f.salary){if(!j.sal||j.sal.monthly||j.sal.max<f.salary)return false;}
  if(f.level&&j.level!==f.level)return false;
  if(f.mode){if(f.mode==="Remote"?j.mode!=="Remote":f.mode==="Hybrid"?j.mode==="Vor Ort":j.mode!=="Vor Ort")return false;}
  if(j.days>f.date)return false;
  if(f.saved&&!saved.has(j.id))return false;
  return true;
}
let visible=[],outside=[];
function compute(){
  const f=readFilters();
  FILTER_IDS.forEach(id=>$(id).closest(".pill")&&$(id).closest(".pill").classList.toggle("active",!!$(id).value&&$(id).value!=="0"&&$(id).value!=="999"));
  $("navSaved").classList.toggle("on",f.saved);$("navJobs").classList.toggle("on",!f.saved);
  $("navSaved").setAttribute("aria-pressed",f.saved);$("navJobs").setAttribute("aria-pressed",!f.saved);
  $("savedCount").textContent=saved.size;$("savedCount").hidden=!saved.size;
  visible=[];outside=[];catCounts={};
  const fAll=Object.assign({},f,{cat:"",sub:""});
  for(const j of JOBS){
    if(matches(j,fAll)){const d=state.loc?haversine(state.loc.lat,state.loc.lon,j.lat,j.lon):0;if(!state.loc||d<=state.radius)catCounts[j.cat]=(catCounts[j.cat]||0)+1;}
    if(!matches(j,f))continue;
    j.dist=state.loc?haversine(state.loc.lat,state.loc.lon,j.lat,j.lon):null;
    if(!state.loc||j.dist<=state.radius)visible.push(j);else outside.push(j);
  }
  const sv=j=>j.sal?(j.sal.monthly?j.sal.monthly*13:j.sal.max):-1;
  if(f.sort==="dist"&&state.loc)visible.sort((a,b)=>a.dist-b.dist);
  else if(f.sort==="salary")visible.sort((a,b)=>sv(b)-sv(a));
  else visible.sort((a,b)=>a.days-b.days||(a.dist??0)-(b.dist??0));
}

function renderList(){
  const n=visible.length;
  $("count").innerHTML=`${n} ${n===1?"Stelle":"Stellen"}`+(state.loc?`<small>im Umkreis von ${state.radius} km um ${esc(state.loc.label)}${outside.length?` · ${outside.length} weitere ausserhalb`:""}</small>`:"<small>in der ganzen Schweiz</small>");
  $("list").innerHTML=n?visible.slice(0,250).map(cardHTML).join(""):`<div class="empty">Keine Stellen gefunden.<br>Vergrössere den Umkreis oder setze Filter zurück.${outside.length?`<br><br><button type="button" class="btn btn-primary" style="padding:8px 14px" id="widen">Umkreis auf ${[5,10,15,25,50,100,200].find(x=>x>state.radius)||200} km erweitern</button>`:""}</div>`;

$("list").addEventListener("click",e=>{
  const card=e.target.closest(".card");if(!card)return;const id=+card.dataset.id;
  if(e.target.closest("[data-save]")){saved.has(id)?saved.delete(id):saved.add(id);persistSaved();update();return;}
  if(e.target.closest("[data-apply]")){card.querySelector("[data-applynote]").hidden=false;return;}
  if(e.target.closest("[data-focus]")){const j=JOBS.find(x=>x.id===id);setView("map");focusJob(j);return;}
  if(e.target.closest("[data-stop]"))return;
  select(state.selected===id?null:id,false);
});

const outline=(()=>{
  const g=L.layerGroup(),ll=pts=>pts.map(p=>[p[1],p[0]]);
  g.addLayer(L.rectangle([[44,3],[49.5,13]],{stroke:false,fillColor:"#DCE6F2",fillOpacity:1,interactive:false}));
  g.addLayer(L.polygon(ll(BORDER),{color:"#7F93B2",weight:1.5,fillColor:"#F4F8FC",fillOpacity:1,interactive:false}));
  LAKE_POLYS.forEach(p=>g.addLayer(L.polygon(ll(p),{stroke:false,fillColor:"#AFCFEA",fillOpacity:1,interactive:false})));
  LAKE_LINES.forEach(l=>g.addLayer(L.polyline(ll(l.p),{color:"#AFCFEA",weight:Math.max(3,l.w*2),lineCap:"round",lineJoin:"round",interactive:false})));
  PLACES.filter(p=>p[4]>=3).forEach(p=>g.addLayer(L.marker([p[2],p[3]],{interactive:false,keyboard:false,icon:L.divIcon({className:"jm-city"+(p[4]>=7?" big":""),html:esc(p[0]),iconSize:null})})));
  return g;})();
const BASEMAPS=[
  ["Satellit",satellite],
  ["Satellit Schweiz (swisstopo, sehr scharf)",L.tileLayer("https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.swissimage/default/current/3857/{z}/{x}/{y}.jpeg",{maxNativeZoom:19,maxZoom:20,attribution:ATTR_TOPO})],
  ["Strassenkarte",L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",{subdomains:"abcd",maxZoom:20,attribution:ATTR_CARTO})],
  ["Dunkel",L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png",{subdomains:"abcd",maxZoom:20,attribution:ATTR_CARTO})]
  ,["Umriss (offline)",outline]
];
function currentBase(){return BASEMAPS.find(b=>map.hasLayer(b[1]));}
function setBase(kind){
  const dark=document.documentElement.getAttribute("data-theme")==="dark";
  const want=kind==="sat"?BASEMAPS[0]:(dark?BASEMAPS[3]:BASEMAPS[2]);
  BASEMAPS.forEach(b=>{if(b!==want&&map.hasLayer(b[1]))map.removeLayer(b[1]);});
  if(!map.hasLayer(want[1]))want[1].addTo(map);
  document.querySelectorAll(".map-layer button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.base===kind));
}
document.querySelectorAll(".map-layer button").forEach(x=>x.onclick=()=>setBase(x.dataset.base));
// Falls ein Kartendienst nicht lädt, automatisch auf den nächsten wechseln
BASEMAPS.forEach(([name,layer],i)=>{let ok=0,err=0;
  const src=layer.getLayers?layer.getLayers()[0]:layer;
  src.on("tileload",()=>{ok++;});
  src.on("tileerror",()=>{err++;if(err===6&&ok===0&&map.hasLayer(layer)){const next=BASEMAPS[(i+1)%BASEMAPS.length];
    map.removeLayer(layer);next[1].addTo(map);const m=$("geoMsg");m.textContent=next[1]===outline?"Kartenbilder können hier nicht geladen werden. Angezeigt wird ein vereinfachter Umriss der Schweiz.":name+" hat nicht geladen, deshalb wird jetzt "+next[0]+" angezeigt.";m.hidden=false;}});
});
// Startkarte: im Dunkelmodus automatisch die dunkle Karte
const prefersDark=document.documentElement.dataset.theme==="dark"||(document.documentElement.dataset.theme!=="light"&&window.matchMedia("(prefers-color-scheme: dark)").matches);
setBase("map");
const cluster=L.markerClusterGroup({showCoverageOnHover:false,maxClusterRadius:45,
  iconCreateFunction:c=>{const n=c.getChildCount(),sz=n<10?32:n<50?38:44;return L.divIcon({html:"<span>"+n+"</span>",className:"jm-cluster",iconSize:L.point(sz+4,sz+4)});}});
const farLayer=L.layerGroup().addTo(map), canvas=L.canvas({padding:.3});
map.addLayer(cluster);
let radiusCircle=null,homeMarker=null;const markers=new Map();
const pinIcon=(sel,cat)=>{const z=sel?40:30;return L.divIcon({className:"jm-pin"+(sel?" sel":""),html:'<b style="--c:'+(CAT_COLORS[cat]||"#0A84FF")+'"></b>'+catIcon(cat),iconSize:[z,z],iconAnchor:[z/2,z/2+z*.707],tooltipAnchor:[0,-z*.9]});};
function renderMap(){
  cluster.clearLayers();farLayer.clearLayers();markers.clear();
  const ms=visible.map(j=>{
    const m=L.marker([j.lat,j.lon],{icon:pinIcon(j.id===state.selected,j.cat),zIndexOffset:j.id===state.selected?1000:0,keyboard:false});
    m.bindTooltip("<b>"+esc(j.title)+"</b><br>"+esc(j.company)+(j.dist!=null?" · "+j.dist.toFixed(1)+" km":""),{direction:"top"});
    m.on("click",()=>select(j.id,!mobile()));
    markers.set(j.id,m);return m;});
  cluster.addLayers(ms);
  const far=cssVar("--far");
  for(const j of outside)L.circleMarker([j.lat,j.lon],{renderer:canvas,radius:3,stroke:false,fillColor:far,fillOpacity:.85,interactive:false}).addTo(farLayer);
  if(radiusCircle)map.removeLayer(radiusCircle);
  if(homeMarker)map.removeLayer(homeMarker);
  radiusCircle=homeMarker=null;
  if(state.loc){
    const acc=cssVar("--blue");
    radiusCircle=L.circle([state.loc.lat,state.loc.lon],{radius:state.radius*1000,color:acc,weight:2.5,dashArray:"8 6",fillColor:acc,fillOpacity:.10,interactive:false}).addTo(map);
    homeMarker=L.marker([state.loc.lat,state.loc.lon],{icon:L.divIcon({className:"jm-home",html:"<b></b>",iconSize:[36,36],iconAnchor:[18,18+36*.707]}),zIndexOffset:2000,interactive:false}).addTo(map);
  }
}
function popHTML(j){
  const st=salText(j),d=j.dist!=null?(j.dist<10?j.dist.toFixed(1):Math.round(j.dist))+" km":"";
  return `<div class="pop"><div class="pop-head">${companyLogo(j.company,j.logo)}<div><h3>${esc(j.title)}</h3><div class="co">${esc(j.company)}${d?" · "+d:""}</div></div></div>
    <div class="chips" style="--c:${CAT_COLORS[j.cat]}"><span class="chip cat">${esc(j.sub)}</span><span class="chip">${pensumText(j.pensum)}</span><span class="chip">${esc(j.type)}</span></div>
    <div class="pop-foot"><b>${st?esc(st):"Lohn auf Anfrage"}</b>${j.url?`<a class="btn btn-primary btn-link" href="${esc(j.url)}" target="_blank" rel="noopener">Zum Inserat</a>`:""}</div></div>`;
}
function markSelected(prev){
  [prev,state.selected].forEach(id=>{const m=id&&markers.get(id);if(m){m.setIcon(pinIcon(id===state.selected,JOBS[id-1].cat));m.setZIndexOffset(id===state.selected?1000:0);}});
  map.closePopup();
  const m=state.selected&&markers.get(state.selected);
  if(m)cluster.zoomToShowLayer(m,()=>{m.unbindPopup();m.bindPopup(popHTML(JOBS[state.selected-1]),{maxWidth:360,minWidth:290,autoPanPadding:[60,60]}).openPopup();});
}
function highlight(id,on){const m=markers.get(id);const e=m&&m.getElement();if(e)e.classList.toggle("hover",on);}
function fitRadius(){if(radiusCircle)map.fitBounds(radiusCircle.getBounds(),{padding:[16,16]});}
function fitSwiss(){map.fitBounds([[45.82,5.96],[47.81,10.49]]);}
function focusJob(j){const m=markers.get(j.id);if(m)cluster.zoomToShowLayer(m,()=>{map.setView(m.getLatLng(),Math.max(map.getZoom(),15));m.openTooltip();});}
$("zfit").onclick=()=>state.loc?fitRadius():fitSwiss();
map.on("click",e=>{
  const{lat,lng}=e.latlng,np=nearestPlace(lat,lng);
  const label=np.d<1.5?np.p[1]+" "+np.p[0]:"Punkt auf der Karte (nahe "+np.p[0]+")";
  setLoc({lat,lon:lng,label});$("addr").value=label;
});

// ---------- Adresssuche über geo.admin.ch (gratis, ganze Schweiz) ----------
async function geoSearch(text,limit){
  const u="https://api3.geo.admin.ch/rest/services/api/SearchServer?type=locations&sr=4326&origins=address,zipcode,gg25&limit="+(limit||6)+"&searchText="+encodeURIComponent(text);
  const r=await fetch(u);if(!r.ok)throw new Error("HTTP "+r.status);
  const d=await r.json();
  return (d.results||[]).map(x=>({lat:x.attrs.lat,lon:x.attrs.lon,label:x.attrs.label.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim()}));
}
const sug=$("suggest");let sugTimer=null,sugItems=[];
function hideSug(){sug.hidden=true;sug.innerHTML="";sugItems=[];}
$("addr").addEventListener("input",e=>{
  clearTimeout(sugTimer);const v=e.target.value.trim();if(v.length<3){hideSug();return;}
  sugTimer=setTimeout(async()=>{try{sugItems=await geoSearch(v,6);}catch(err){sugItems=[];}
    if(!sugItems.length){hideSug();return;}
    sug.innerHTML=sugItems.map((x,i)=>`<li role="option" data-i="${i}">${esc(x.label)}</li>`).join("");sug.hidden=false;},250);
});
sug.addEventListener("mousedown",e=>{const li=e.target.closest("li");if(!li)return;e.preventDefault();
  const x=sugItems[+li.dataset.i];$("addr").value=x.label;hideSug();setLoc(x);fitRadius();});
$("addr").addEventListener("blur",()=>setTimeout(hideSug,150));
$("addr").addEventListener("keydown",e=>{if(e.key==="Escape")hideSug();});
$("myLoc").onclick=()=>{
  const m=$("geoMsg");
  if(!navigator.geolocation){m.textContent="Dein Browser kann den Standort nicht bestimmen.";m.hidden=false;return;}
  $("myLoc").classList.add("busy");
  navigator.geolocation.getCurrentPosition(p=>{$("myLoc").classList.remove("busy");
      setLoc({lat:p.coords.latitude,lon:p.coords.longitude,label:"deinem Standort"});$("addr").value="Mein Standort";fitRadius();},
    ()=>{$("myLoc").classList.remove("busy");m.textContent="Standort nicht verfügbar. Erlaube den Zugriff im Browser oder gib eine Adresse ein.";m.hidden=false;},
    {enableHighAccuracy:false,timeout:10000});
};

// ---------- Hell / Dunkel ----------
function applyTheme(t,save){
  document.documentElement.setAttribute("data-theme",t);
  $("themeLabel").textContent=t==="dark"?"Hell":"Dunkel";
  $("themeBtn").setAttribute("aria-label",t==="dark"?"Zum hellen Design wechseln":"Zum dunklen Design wechseln");
  if(save){try{localStorage.setItem("jobmap-theme",t);}catch(e){}}
  // Strassenkarte passend mitwechseln (Satellit bleibt)
  const street=BASEMAPS[2][1],darkMap=BASEMAPS[3][1];
  if(t==="dark"&&map.hasLayer(street)){map.removeLayer(street);darkMap.addTo(map);}
  if(t==="light"&&map.hasLayer(darkMap)){map.removeLayer(darkMap);street.addTo(map);}
  if(state.loc)renderMap();
}
$("themeBtn").onclick=()=>applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark",true);
applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"dark":"light",false);

// ---------- Steuerung ----------
function update(){compute();renderList();renderCats();renderMap();}
function setLoc(loc){state.loc=loc;$("geoMsg").hidden=true;$("mapHint").textContent="Klick in die Karte verschiebt deinen Standort";update();}
function setRadius(r){state.radius=r;$("radius").value=r;document.querySelectorAll(".radius-group button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.r===r));update();}
document.querySelectorAll(".radius-group button").forEach(b=>b.onclick=()=>{setRadius(+b.dataset.r);fitRadius();});
$("navJobs").onclick=()=>{$("fSaved").checked=false;update();};
$("navSaved").onclick=()=>{$("fSaved").checked=!$("fSaved").checked;update();};
$("radius").addEventListener("input",e=>setRadius(+e.target.value));
$("radius").addEventListener("change",()=>fitRadius());
$("searchForm").addEventListener("submit",async e=>{
  e.preventDefault();hideSug();const a=$("addr").value.trim(),m=$("geoMsg");
  if(!a){state.loc=null;update();fitSwiss();return;}
  const g=/^\s*(4[5-7]\.\d+)\s*,\s*(\d{1,2}\.\d+)\s*$/.exec(a);
  let loc=g?{lat:+g[1],lon:+g[2],label:"Punkt auf der Karte"}:null;
  if(!loc){try{const r=await geoSearch(a,1);if(r.length)loc=r[0];}catch(err){loc=geocode(a);}}
  if(!loc){m.textContent="Adresse nicht gefunden. Prüfe die Schreibweise (z. B. Bahnhofstrasse 1, 8001 Zürich) oder klicke in die Karte.";m.hidden=false;update();return;}
  setLoc(loc);fitRadius();
});
$("q").addEventListener("input",update);
[...FILTER_IDS,"fSaved","sort"].forEach(id=>$(id).addEventListener("change",update));
$("resetBtn").onclick=()=>{fCat.selectedIndex=0;fillSub();FILTER_IDS.forEach(id=>{$(id).selectedIndex=0;});$("fSaved").checked=false;$("q").value="";update();};
function setView(v){$("split").dataset.view=v;$("viewFabLabel").textContent=v==="map"?"Liste anzeigen":"Karte anzeigen";if(v==="map"){map.invalidateSize();window.scrollTo({top:$("split").offsetTop-8});}}
$("viewFab").onclick=()=>setView($("split").dataset.view==="map"?"list":"map");

// Start: Beispielsuche Zürich, 15 km
state.loc=geocode($("addr").value);state.loc.label="Bahnhofstrasse 1, 8001 Zürich";
update();fitRadius();

// ---------- Echte Stellen laden (data/jobs.json vom Crawler) ----------
// Funktioniert nur, wenn die Seite über einen Webserver läuft (z. B. GitHub Pages).
// Fehlt die Datei oder ist sie leer, bleiben die Beispieldaten sichtbar.
(async function loadRealJobs(){
  try{
    const r=await fetch("data/jobs.json",{cache:"no-cache"});if(!r.ok)return;
    const d=await r.json();if(!d||!Array.isArray(d.jobs)||!d.jobs.length)return;
    const now=Date.now();JOBS.length=0;
    d.jobs.forEach((j,i)=>{if(typeof j.lat!=="number"||typeof j.lon!=="number")return;
      JOBS.push(Object.assign({},j,{id:JOBS.length+1,cat:CAT_COLORS[j.cat]?j.cat:"Weitere Berufe",sub:j.sub||"Andere",
        days:j.posted?Math.max(0,Math.floor((now-Date.parse(j.posted))/864e5)):0,tasks:j.tasks||[],req:j.req||[]}));});
    const when=d.generated?new Date(d.generated).toLocaleDateString("de-CH"):"";
    $("demoBadge").textContent=JOBS.length.toLocaleString("de-CH")+" echte Stellen"+(when?" · Stand "+when:"");
    $("demoBadge").classList.add("live");
    const src=[...new Set(JOBS.map(j=>j.source).filter(Boolean))];
    if(src.length){const n=$("srcNote");n.innerHTML="Quellen: "+src.map(x=>x==="Adzuna"?'<a href="https://www.adzuna.ch" target="_blank" rel="noopener">Jobs by Adzuna</a>':x==="Careerjet"?'<a href="https://www.careerjet.ch" target="_blank" rel="noopener">Jobs by Careerjet</a>':x==="Jooble"?'<a href="https://ch.jooble.org" target="_blank" rel="noopener">Jobs by Jooble</a>':esc(x)).join(" · ");n.hidden=false;}
    state.selected=null;fillSub();update();
  }catch(e){console.info("Keine echten Stellen geladen:",e);}
})();
})();
